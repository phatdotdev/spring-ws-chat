<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Public & Private WebSocket</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div>
    <input type="text" id="username" placeholder="Tên của bạn (vd: userA)" />
    <button onclick="connect()">Kết nối</button>
    <span id="status" style="color: gray; margin-left: 10px;">Chưa kết nối</span>
</div>

<hr/>

<div>
    <h4>1. Gửi chung cho tất cả (Broadcast)</h4>
    <input type="text" id="publicContent" placeholder="Nhập tin nhắn chung..." />
    <button onclick="sendPublic()">Gửi tất cả</button>
</div>

<hr/>

<div>
    <h4>2. Gửi riêng cho 1 người (Private)</h4>
    <input type="text" id="toUser" placeholder="Gửi tới ai (vd: userB)" />
    <input type="text" id="privateContent" placeholder="Nhập tin nhắn riêng..." />
    <button onclick="sendPrivate()">Gửi riêng</button>
</div>

<hr/>

<h3>Received Messages:</h3>
<ul id="received-messages"></ul>

<script>
    let stompClient = null;

    function connect() {
        const username = document.getElementById('username').value.trim();
        if (!username) return alert("Vui lòng nhập tên của bạn!");

        const socket = new SockJS('/ws?username=' + encodeURIComponent(username));
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            document.getElementById('status').textContent = 'Đã kết nối: ' + username;
            document.getElementById('status').style.color = 'green';

            // Kênh 1: Lắng nghe tin nhắn chung (ai cũng nhận được)
            stompClient.subscribe('/topic/notifications', function (response) {
                appendMessage(response.body);
            });

            // Kênh 2: Lắng nghe tin nhắn riêng (chỉ đúng user này nhận được)
            stompClient.subscribe('/user/queue/notifications', function (response) {
                appendMessage(response.body);
            });
        });
    }

    function sendPublic() {
        const content = document.getElementById('publicContent').value.trim();
        if (!stompClient || !content) return;

        stompClient.send("/app/send-message", {}, content);
        document.getElementById('publicContent').value = '';
    }

    function sendPrivate() {
        const toUser = document.getElementById('toUser').value.trim();
        const content = document.getElementById('privateContent').value.trim();
        if (!stompClient || !toUser || !content) return;

        stompClient.send("/app/send-private", {}, JSON.stringify({
            toUser: toUser,
            content: content
        }));
        document.getElementById('privateContent').value = '';
    }

    function appendMessage(text) {
        const li = document.createElement('li');
        li.textContent = text;
        document.getElementById('received-messages').appendChild(li);
    }
</script>
</body>
</html>
